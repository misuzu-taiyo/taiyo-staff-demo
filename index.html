<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAIYO STAFF | デモ</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#26372e;background:#f7f8f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:20px;border-bottom:3px solid #f2c94c}main{max-width:860px;margin:auto;padding:20px}h1{margin:0;font-size:23px}.note{color:#695b30;background:#fff3c8;padding:12px;border-radius:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{border:0;border-radius:10px;background:#e6ebdf;padding:12px;cursor:pointer;font-size:15px}button.active,.primary{background:#e8bf36;color:#252f25}section{display:none}section.active{display:block}.card{background:#fff;padding:18px;margin:12px 0;border-radius:14px;box-shadow:0 2px 8px #0000000a}input,textarea,select{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #d2d9cd;border-radius:9px;font:inherit}label{font-weight:600}.muted{color:#67756a;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}article{white-space:pre-wrap;line-height:1.8}.danger{background:#fce1df}</style></head><body><header><h1>☀️ TAIYO STAFF</h1><div class="muted">社内ポータル・公開用デモ</div></header><main><p class="note">⚠️ このデモは誰でも閲覧できるGitHub Pages用です。実際の社内マニュアル、社員情報、個人情報は登録しないでください。追加内容はこの端末内だけに保存され、他の人には共有されません。</p><nav class="tabs"><button data-tab="home" class="active">🏠 ホーム</button><button data-tab="manuals">📚 マニュアル</button><button data-tab="admin">⚙️ 管理（デモ）</button></nav><section id="home" class="active"><div class="card"><h2>ようこそ！</h2><p>TAIYO STAFFの動作確認用デモです。</p><p>「管理（デモ）」から架空のマニュアルを追加すると、「マニュアル」に反映されます。</p></div></section><section id="manuals"><div class="card"><label for="search">マニュアルを検索</label><input id="search" placeholder="タイトル・本文で検索"><label for="filter">カテゴリー</label><select id="filter"><option value="">すべて</option></select></div><div id="list"></div></section><section id="admin"><div class="card"><h2>マニュアル追加（デモ）</h2><form id="form"><label>タイトル<input id="title" required maxlength="100" placeholder="例：電話対応（練習用）"></label><label>カテゴリー<input id="category" required maxlength="40" placeholder="例：受付"></label><label>本文<textarea id="body" required rows="5" placeholder="架空の文章を入力してください"></textarea></label><button class="primary" type="submit">追加して一覧に反映</button></form><p id="status" role="status" class="muted"></p><button id="reset" class="danger">デモデータを初期化</button></div></section></main><script>(()=>{'use strict';const key='taiyo-staff-demo-v1';const defaults=[{id:'sample-1',title:'電話対応（サンプル）',category:'受付',body:'こちらは動作確認用の架空のマニュアルです。\n実際の社内ルールではありません。'},{id:'sample-2',title:'開店準備（サンプル）',category:'店舗運営',body:'こちらは動作確認用の架空のマニュアルです。'}];let items;try{const saved=JSON.parse(localStorage.getItem(key));items=Array.isArray(saved)?saved:defaults.slice()}catch(e){items=defaults.slice()}const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(key,JSON.stringify(items));return true}catch(e){return false}};function render(){const filter=$('filter').value;const cats=[...new Set(items.map(x=>x.category))].sort();$('filter').replaceChildren(new Option('すべて',''),...cats.map(x=>new Option(x,x)));$('filter').value=cats.includes(filter)?filter:'';const q=$('search').value.trim().toLowerCase();$('list').replaceChildren();let shown=0;items.filter(x=>(!$('filter').value||x.category===$('filter').value)&&[x.title,x.category,x.body].join(' ').toLowerCase().includes(q)).forEach(x=>{shown++;const card=document.createElement('div');card.className='card';const h=document.createElement('h3');h.textContent=x.title;const cat=document.createElement('p');cat.className='muted';cat.textContent=x.category;const body=document.createElement('article');body.textContent=x.body;const del=document.createElement('button');del.textContent='削除（デモ）';del.addEventListener('click',()=>{if(confirm('このデモ項目を削除しますか？')){items=items.filter(y=>y.id!==x.id);save();render()}});card.append(h,cat,body,del);$('list').append(card)});if(!shown){const p=document.createElement('p');p.textContent='該当するマニュアルはありません。';$('list').append(p)}}document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===btn.dataset.tab));if(btn.dataset.tab==='manuals')render()}));$('form').addEventListener('submit',e=>{e.preventDefault();items.unshift({id:String(Date.now())+Math.random(),title:$('title').value.trim(),category:$('category').value.trim(),body:$('body').value.trim()});const ok=save();$('status').textContent=ok?'追加しました。「マニュアル」タブで確認してください。':'一覧には追加しましたが、このブラウザでは保存できません。';$('form').reset();render()});$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('reset').addEventListener('click',()=>{if(confirm('デモデータを初期化しますか？')){items=defaults.slice();save();render();$('status').textContent='初期化しました。'}});render()})();</script></body></html>
